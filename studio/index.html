<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#315dbe"><title>Skill Blueprint Studio</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <div class="app-shell">
    <header class="topbar"><a class="brand" href="#" aria-label="Skill Blueprint Studio home"><span class="brand-mark" aria-hidden="true">s</span>skill blueprint<span class="brand-sub">studio</span></a><span class="top-context">From intent to a skill that holds together.</span><div class="top-actions"><span id="save-state" class="save-state">Opening local database…</span><button class="button quiet editor-only" data-action="undo" aria-label="Undo last change" hidden>↶ Undo</button><button class="button quiet editor-only" data-action="redo" aria-label="Redo last change" hidden>↷ Redo</button><button class="button" data-action="save-project">Back up projects</button></div></header>
    <aside class="sidebar"><div class="sidebar-caption">YOUR WORKSPACE</div><nav aria-label="Workspace navigation"><button data-page="projects" class="nav-item active"><span class="nav-symbol">▦</span>Projects</button><button data-page="skills" class="nav-item project-only" hidden><span class="nav-symbol">◇</span>Project skills</button><div class="sidebar-divider editor-only" hidden></div><button data-page="workflow" class="nav-item editor-only" hidden><span class="nav-symbol">▦</span>Workflow<span class="nav-shortcut">01</span></button><button data-page="references" class="nav-item editor-only" hidden><span class="nav-symbol">≡</span>References & rules<span class="nav-shortcut">02</span></button><button data-page="screens" class="nav-item editor-only" hidden><span class="nav-symbol">▤</span>Input & output<span class="nav-shortcut">03</span></button><button data-page="scenarios" class="nav-item editor-only" hidden><span class="nav-symbol">▷</span>Test scenarios<span class="nav-shortcut">04</span></button><button data-page="package" class="nav-item editor-only" hidden><span class="nav-symbol">↗</span>Review & export<span id="nav-issues" class="issue-count"></span></button></nav><div class="sidebar-bottom"><div class="sidebar-divider"></div><button class="button quiet" data-action="create-workspace-project">＋ Create project</button><button class="button quiet project-only" data-action="add-skill" hidden>＋ Add skill</button><button class="button quiet" data-action="restore-project">Restore project</button><button class="button quiet directory-only" data-action="demo">Explore the demo</button><p>Projects organize your skills.<br>Skills define the process.</p></div></aside>
    <main class="main"><nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb" hidden></nav><div id="workspace-notice" class="notice-box workspace-notice" role="status" hidden></div><section class="project-header"><div><div class="eyebrow" id="project-eyebrow">YOUR WORKSPACE</div><h1 id="project-title">Projects</h1><p id="project-description">Keep related skills together. Open a project or start a new one.</p></div><div id="project-actions" class="project-actions"></div></section><div id="content"></div></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog"><form id="dialog-form"><header class="dialog-header"><div><p id="dialog-eyebrow" class="eyebrow"></p><h2 id="dialog-title"></h2></div><button class="button quiet close-dialog" type="button" data-action="close" aria-label="Close dialog">✕</button></header><div id="dialog-body" class="dialog-body"></div><footer id="dialog-footer" class="dialog-footer"></footer></form></dialog>
  <input id="skill-file" type="file" accept=".md,.zip" hidden><input id="project-file" type="file" accept=".json" hidden><input id="reference-file" type="file" accept=".md" multiple hidden><input id="resource-file" type="file" multiple hidden>
  <script type="module" src="app.mjs"></script>
</body></html>
