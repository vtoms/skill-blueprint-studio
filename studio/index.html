<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#315dbe"><title>Skill Blueprint Studio</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <div id="startup-state" class="startup-state" role="status" aria-live="polite"><span class="startup-spinner" aria-hidden="true"></span><span>Starting Studio… Opening your projects.</span></div>
  <div class="app-shell" aria-busy="true">
    <header class="topbar"><a class="brand" href="#" aria-label="Skill Blueprint Studio home"><span class="brand-mark" aria-hidden="true">s</span>skill blueprint<span class="brand-sub">studio</span></a><div class="top-actions"><button type="button" id="theme-toggle" class="button theme-toggle" aria-label="Switch to dark theme" aria-pressed="false" title="Switch to dark theme"><svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/></svg><svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.1A8.6 8.6 0 0 1 9.9 3.5a8.6 8.6 0 1 0 10.6 10.6Z"/></svg><span data-theme-label>Light</span></button><span class="saving-group"><span id="save-state" class="save-state">Opening your projects…</span><span id="saving-help"></span></span><button class="button quiet editor-only" data-action="undo" aria-label="Undo last change" hidden>↶ Undo</button><button class="button quiet editor-only" data-action="redo" aria-label="Redo last change" hidden>↷ Redo</button><button class="button" data-action="save-project">Back up projects</button></div></header>
    <aside class="sidebar"><nav aria-label="Workspace navigation"><button data-page="projects" class="nav-item active"><span class="nav-symbol">▦</span>Projects</button><button data-page="skills" class="nav-item project-only" hidden><span class="nav-symbol">◇</span>Project skills</button><div class="sidebar-divider editor-only" hidden></div><button data-page="brief" class="nav-item editor-only chapter-nav" hidden><span class="chapter-number">1</span><span class="chapter-label"><strong>Brief</strong><small data-chapter-status="brief"></small></span></button><button data-page="workflow" class="nav-item editor-only chapter-nav" hidden><span class="chapter-number">2</span><span class="chapter-label"><strong>Steps</strong><small data-chapter-status="workflow"></small></span></button><button data-page="references" class="nav-item editor-only chapter-nav" hidden><span class="chapter-number">3</span><span class="chapter-label"><strong>Rules & files</strong><small data-chapter-status="references"></small></span></button><button data-page="screens" class="nav-item editor-only chapter-nav" hidden><span class="chapter-number">4</span><span class="chapter-label"><strong>Input & output</strong><small data-chapter-status="screens"></small></span></button><button data-page="package" class="nav-item editor-only chapter-nav" hidden><span class="chapter-number">5</span><span class="chapter-label"><strong>Review & package</strong><small data-chapter-status="package"></small></span><span id="nav-issues" class="issue-count"></span></button><button data-page="scenarios" class="nav-item editor-only chapter-nav" hidden><span class="chapter-number">6</span><span class="chapter-label"><strong>Test in Claude</strong><small data-chapter-status="scenarios"></small></span></button><button data-page="improve" class="nav-item editor-only chapter-nav" hidden><span class="chapter-number">7</span><span class="chapter-label"><strong>Improve</strong><small data-chapter-status="improve"></small></span></button></nav><label class="mobile-chapter-picker editor-only" hidden><span>Skill section</span><select id="chapter-select" aria-label="Choose a skill section"></select></label><div class="sidebar-bottom"><div class="sidebar-divider"></div><button class="button quiet" data-action="create-workspace-project">＋ Create project</button><button class="button quiet project-only" data-action="add-skill" hidden>＋ Add skill</button><button class="button quiet" data-action="restore-project">Restore project</button><button class="button quiet directory-only" data-action="demo">Explore the demo</button></div></aside>
    <main class="main"><nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb" hidden></nav><div id="workspace-notice" class="notice-box workspace-notice" role="status" hidden></div><div id="action-error" class="action-error" role="alert" hidden><p id="action-error-message"></p><button type="button" class="button quiet" data-action="dismiss-error" aria-label="Dismiss this message">×</button></div><section class="project-header"><div><div class="eyebrow" id="project-eyebrow">YOUR WORKSPACE</div><div class="heading-with-help"><h1 id="project-title">Projects</h1><span id="page-help"></span></div><p id="project-description">Keep related skills together. Open a project or start a new one.</p></div><div id="project-actions" class="project-actions"></div></section><div id="content"></div></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog"><form id="dialog-form"><header class="dialog-header"><div><p id="dialog-eyebrow" class="eyebrow"></p><div class="heading-with-help"><h2 id="dialog-title"></h2><span id="dialog-title-help"></span></div></div><button class="button quiet close-dialog" type="button" data-action="close" aria-label="Close dialog">✕</button></header><div id="dialog-body" class="dialog-body"></div><footer id="dialog-footer" class="dialog-footer"></footer></form></dialog>
  <input id="skill-file" type="file" accept=".md,.zip" hidden><input id="project-file" type="file" accept=".json" hidden><input id="reference-file" type="file" accept=".md" multiple hidden><input id="resource-file" type="file" multiple hidden>
  <script type="module" src="app.mjs"></script>
</body></html>
