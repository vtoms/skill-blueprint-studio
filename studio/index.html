<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#315dbe"><title>Skill Blueprint Studio</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <div class="app-shell">
    <header class="topbar"><a class="brand" href="#" aria-label="Skill Blueprint Studio home"><span class="brand-mark" aria-hidden="true">s</span>skill blueprint<span class="brand-sub">studio</span></a><span class="top-context">From intent to a skill that holds together.</span><div class="top-actions"><span id="save-state" class="save-state">Local draft</span><button class="button quiet" data-action="undo" aria-label="Undo last change">↶ Undo</button><button class="button quiet" data-action="redo" aria-label="Redo last change">↷ Redo</button><button class="button" data-action="save-project">Save project</button></div></header>
    <aside class="sidebar"><div class="sidebar-caption">SKILL AUTHORING</div><nav aria-label="Workspace navigation"><button data-page="workflow" class="nav-item active"><span class="nav-symbol">▦</span>Workflow<span class="nav-shortcut">01</span></button><button data-page="references" class="nav-item"><span class="nav-symbol">≡</span>References & rules<span class="nav-shortcut">02</span></button><button data-page="screens" class="nav-item"><span class="nav-symbol">▤</span>Input & output<span class="nav-shortcut">03</span></button><button data-page="scenarios" class="nav-item"><span class="nav-symbol">▷</span>Test scenarios<span class="nav-shortcut">04</span></button><button data-page="package" class="nav-item"><span class="nav-symbol">↗</span>Review & export<span id="nav-issues" class="issue-count"></span></button></nav><div class="sidebar-bottom"><div class="sidebar-divider"></div><button class="button quiet" data-action="new">＋ New skill</button><button class="button quiet" data-action="import">↥ Import a skill</button><button class="button quiet" data-action="open-project">Open project</button><button class="button quiet" data-action="demo">Open generic demo</button><p>Instructions and references.<br>One coherent process.</p></div></aside>
    <main class="main"><section class="project-header"><div><div class="eyebrow" id="project-eyebrow">YOUR SKILL / WORKSPACE</div><h1 id="project-title">Data processing workflow</h1><p id="project-description"></p></div><div class="project-actions"><button class="button" data-action="project">Edit brief</button><button class="button primary" data-page="package">Review & export <span aria-hidden="true">↗</span></button></div></section><div id="content"></div></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog"><form id="dialog-form"><header class="dialog-header"><div><p id="dialog-eyebrow" class="eyebrow"></p><h2 id="dialog-title"></h2></div><button class="button quiet close-dialog" type="button" data-action="close" aria-label="Close dialog">✕</button></header><div id="dialog-body" class="dialog-body"></div><footer id="dialog-footer" class="dialog-footer"></footer></form></dialog>
  <input id="skill-file" type="file" accept=".md,.zip" hidden><input id="project-file" type="file" accept=".json" hidden><input id="reference-file" type="file" accept=".md" multiple hidden><input id="resource-file" type="file" multiple hidden>
  <script type="module" src="app.mjs"></script>
</body></html>
