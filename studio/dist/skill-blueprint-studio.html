function createAppearance({document=globalThis.document,media=globalThis.matchMedia('(prefers-color-scheme: dark)'),onChange=()=>{}}={}){
 const button=document.querySelector('#theme-toggle');let preference;
 function apply(){
  const theme=preference||(media.matches?'dark':'light'),dark=theme==='dark';
  document.documentElement.dataset.theme=theme;
  button.setAttribute('aria-pressed',String(dark));
  button.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');
  button.title=dark?'Switch to light theme':'Switch to dark theme';
  button.querySelector('[data-theme-label]').textContent=dark?'Dark':'Light';
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#101722':'#f5f7fb');
 }
 function setPreference(value){preference=['light','dark'].includes(value)?value:undefined;apply();}
 const systemChanged=()=>{if(!preference)apply();};
 media.addEventListener('change',systemChanged);
 button.addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';setPreference(theme);onChange(theme);});
 apply();return {setPreference,destroy(){media.removeEventListener('change',systemChanged);}};
}

   try{while(true){const result=await reader.read();if(result.done)break;length+=result.value.length;if(length>size||length>2*1024*1024)throw new Error('ZIP entry expands beyond its declared size.');chunks.push(result.value);}}
   catch(error){await reader.cancel().catch(()=>{});throw error;}
   expanded=new Uint8Array(length);let at=0;for(const chunk of chunks){expanded.set(chunk,at);at+=chunk.length;}
  }
  if(expanded.length!==size||crc32(expanded)!==crc)throw new Error('ZIP integrity check failed for '+path);
  if(!directory)files[path]=expanded;
 }
 if(cursor!==centralEnd)throw new Error('ZIP directory entry count mismatch.');

}

const WORKSPACE_STORE='skill-blueprint-studio-workspace-v1';
const LEGACY_SKILL_STORE='agentic-studio-public-project-v1';
const WORKSPACE_TYPE='skill-blueprint-workspace';
const PROJECT_TYPE='skill-blueprint-project';

function emptyWorkspace(){return {type:WORKSPACE_TYPE,schemaVersion:1,projects:[]};}
function createWorkspaceProject(name,description=''){
  const title=String(name).trim();
  if(!title||title.length>100)throw new Error('Use a project name between 1 and 100 characters.');
  const now=new Date().toISOString();
  return {id:uid(),name:title,description:String(description).trim(),createdAt:now,updatedAt:now,skills:[]};
}
function addWorkspaceProject(workspace,container){
  if(workspace.projects.some(item=>item.id===container.id))throw new Error('That project already exists.');
  if(workspace.projects.length>=200)throw new Error('This workspace supports up to 200 projects.');
  workspace.projects.push(container);return container;
}
function workspaceProject(workspace,id){return workspace.projects.find(item=>item.id===id)||null;}
function workspaceSkill(workspace,projectId,skillId){return workspaceProject(workspace,projectId)?.skills.find(item=>item.id===skillId)||null;}
function addWorkspaceSkill(workspace,projectId,skill){
  const container=workspaceProject(workspace,projectId);
  if(!container)throw new Error('Choose a project before adding a skill.');
  if(container.skills.some(item=>item.id===skill.id))throw new Error('That skill is already in this project.');
  if(container.skills.length>=100)throw new Error('This project supports up to 100 skills.');
  container.skills.push(copy(skill));container.updatedAt=new Date().toISOString();return skill;
}
function updateWorkspaceSkill(workspace,projectId,skill){
  const container=workspaceProject(workspace,projectId),index=container?.skills.findIndex(item=>item.id===skill.id)??-1;
  if(index<0)throw new Error('The skill no longer belongs to this project.');
  container.skills[index]=copy(skill);container.updatedAt=new Date().toISOString();
}
function checkedWorkspaceProject(value){
  if(!value||typeof value.id!=='string'||!value.id||typeof value.name!=='string'||!value.name.trim()||value.name.length>100||typeof value.description!=='string'||!Array.isArray(value.skills)||value.skills.length>100)throw new Error('Invalid project in the backup.');
  const result={...value,skills:value.skills.map(skill=>readProject(JSON.stringify(skill)))};
  if(result.skills.some(skill=>typeof skill.id!=='string'||!skill.id)||new Set(result.skills.map(skill=>skill.id)).size!==result.skills.length)throw new Error('Skill identities must be unique within a project.');
  for(const field of ['createdAt','updatedAt'])if(typeof result[field]!=='string'||!Number.isFinite(Date.parse(result[field])))throw new Error('Invalid project date in the backup.');
  return result;
}
function readWorkspace(text){
  if(text.length>128*1024*1024)throw new Error('Workspace backups must be under 128 MB.');
  const value=JSON.parse(text);
  if(value?.type!==WORKSPACE_TYPE||value.schemaVersion!==1||!Array.isArray(value.projects)||value.projects.length>200)throw new Error('This is not a workspace backup.');
  const projects=value.projects.map(checkedWorkspaceProject);
  if(new Set(projects.map(container=>container.id)).size!==projects.length)throw new Error('Project identities must be unique.');
  const result={type:WORKSPACE_TYPE,schemaVersion:1,projects};
  if(value.appearance!==undefined){if(!['light','dark'].includes(value.appearance))throw new Error('Invalid workspace appearance.');result.appearance=value.appearance;}
  if(value.browserImports!==undefined){if(!Array.isArray(value.browserImports)||value.browserImports.length>200||value.browserImports.some(digest=>typeof digest!=='string'||!/^[a-f0-9]{64}$/.test(digest)))throw new Error('Invalid browser migration record.');result.browserImports=[...new Set(value.browserImports)];}
  return result;
}
function workspaceProjectBackup(container){return {type:PROJECT_TYPE,schemaVersion:1,project:copy(container)};}
function readWorkspaceProjectBackup(text){
  if(text.length>64*1024*1024)throw new Error('Project backups must be under 64 MB.');
  const value=JSON.parse(text);
  if(value?.type===PROJECT_TYPE&&value.schemaVersion===1)return checkedWorkspaceProject(value.project);
  const skill=readProject(text),container=createWorkspaceProject(skill.title||'Recovered draft','Restored from a single-skill backup.');
  container.skills=[skill];return container;
}
function restoreWorkspaceProject(workspace,container){
  const restored=checkedWorkspaceProject(container);
  restored.id=uid();restored.updatedAt=new Date().toISOString();
  if(workspace.projects.some(item=>item.name===restored.name)){const original=restored.name;let suffix=' (restored)',counter=1;while(workspace.projects.some(item=>item.name===original.slice(0,100-suffix.length)+suffix)){suffix=' (restored '+(++counter)+')';}restored.name=original.slice(0,100-suffix.length)+suffix;}
  addWorkspaceProject(workspace,restored);return restored;
}
function recoverLegacyWorkspace(text){
  const workspace=emptyWorkspace();if(!text)return workspace;
  const skill=readProject(text),container=createWorkspaceProject('Recovered drafts','Your previously saved skill is preserved here.');
  container.skills=[skill];workspace.projects.push(container);return workspace;
}

// The workflow is an ordered sequence. Connections are derived from that order.
function captureWorkflowInputs(skill){
  return new Map(skill.steps.map((step,index)=>{
    const previous=skill.steps[index-1];
    return [step.id,previous?{id:previous.id,title:previous.title,output:previous.output}:{id:'$overall-input',title:'Overall input',output:skill.input}];
  }));
}

function reviewChangedInputs(skill,before){
  const current=captureWorkflowInputs(skill);
  for(const step of skill.steps){
    const previous=step.inputReview?.previous||before.get(step.id);
    if(!previous)continue; // A new step has no previously reviewed predecessor.
    if(previous.id!==current.get(step.id).id)step.inputReview={previous:{...previous}};
    else delete step.inputReview;
  }
}

 function fit(){const bounds=diagramGeometry(skill,positions).bounds,width=bounds.right-bounds.left,height=bounds.bottom-bounds.top;state.zoom=clampZoom(Math.min(1,(viewport.clientWidth-56)/width,(viewport.clientHeight-56)/height));state.x=(viewport.clientWidth-width*state.zoom)/2-bounds.left*state.zoom;state.y=(viewport.clientHeight-height*state.zoom)/2-bounds.top*state.zoom;state.initialized=true;transform();}

const wfEsc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const wfButton=(label,action,extra='',kind='quiet small-button')=>`<button type="button" class="button ${kind}" data-action="${action}" ${extra}>${label}</button>`;
const wfKinds=['Input','Select','Retrieve','Transform','Output','Process'];
const wfTypes=['Instruction','Reference','Tool','Business rule','Decision','Exception'];

function wfField(label,key,value,{scope='step',id='',multiline=false,rows=3,options=null,help=''}={}){
  const fieldId='edit-'+scope+'-'+(id||'step')+'-'+key;
  const attributes=`id="${wfEsc(fieldId)}" ${help?`aria-describedby="${wfEsc(fieldId)}-hint"`:''} name="${wfEsc(key)}" data-edit="${scope}" data-key="${wfEsc(key)}"${id?` data-id="${wfEsc(id)}"`:''} aria-label="${wfEsc(label)}"`;
  const control=options?`<select ${attributes}>${options.map(item=>{const option=typeof item==='string'?{value:item,label:item}:item;return `<option value="${wfEsc(option.value)}" ${option.value===value?'selected':''}>${wfEsc(option.label)}</option>`;}).join('')}</select>`:multiline?`<textarea ${attributes} rows="${rows}">${wfEsc(value)}</textarea>`:`<input ${attributes} value="${wfEsc(value)}">`;
  return `<label class="field" for="${wfEsc(fieldId)}"><span>${label}</span>${control}${help?`<span class="help" id="${wfEsc(fieldId)}-hint">${help}</span>`:''}</label>`;
}

function workflowStepStatus(skill,step,checks){
  const chips=[];
  if(!step.title.trim())chips.push('Missing name');
  if(!step.job.trim())chips.push('Missing instructions');
  if(!step.output.trim())chips.push('Missing output');
  if(!step.reviewed)chips.push(skill.generation||skill.optimization?'Not confirmed':'Not confirmed');
  if(step.inputReview)chips.push('Check new input');
  if(step.facets.some(f=>{const definition=skill.definitions.find(d=>d.id===f.definitionId);return definition&&f.override&&f.override!==definition.value;}))chips.push('Value differs');
  const errors=checks.errors.filter(issue=>issue.stepId===step.id);
  if(errors.length&&!chips.length)chips.push(`${errors.length} ${errors.length===1?'check':'checks'}`);
  return chips.map(label=>`<span class="step-status">${wfEsc(label)}</span>`).join('')||'<span class="step-status clear">Defined</span>';
}

function wfInsideSummary(step){
  const tools=step.facets.filter(f=>f.type==='Tool').length,rules=step.facets.filter(f=>['Business rule','Decision'].includes(f.type)).length,files=step.references.length+step.resourceIds.length;
  return [tools?`${tools} ${tools===1?'tool':'tools'}`:'',rules?`${rules} ${rules===1?'rule':'rules'}`:'',files?`${files} ${files===1?'file':'files'}`:'',`${step.facets.length} inside`].filter(Boolean).join(' · ');
}

function wfMoveControls(step,index,count){
  return `<div class="step-order">${wfButton('↑','move-up',`data-id="${wfEsc(step.id)}" aria-label="Run ${wfEsc(step.title||'step')} earlier" ${index===0?'disabled':''}`)}${wfButton('↓','move-down',`data-id="${wfEsc(step.id)}" aria-label="Run ${wfEsc(step.title||'step')} later" ${index===count-1?'disabled':''}`)}</div>`;
}

function workflowStageMarkup(skill,state){
  const index=skill.steps.findIndex(step=>step.id===state.selected),needsAttention=step=>state.checks.errors.some(issue=>issue.stepId===step.id),visibleSteps=state.attentionOnly?skill.steps.filter(needsAttention):skill.steps;
  let body='';
  if(state.view==='flow'){
    body=workflowDiagramMarkup(skill,state);
  }else if(state.view==='list'){
    body=`<div class="list-audit-bar"><span>${skill.steps.filter(needsAttention).length} of ${skill.steps.length} steps need attention</span><button type="button" class="button small-button" data-action="toggle-attention" aria-pressed="${Boolean(state.attentionOnly)}">${state.attentionOnly?'Show all steps':'Needs attention only'}</button></div><div class="workflow-table-scroll"><table class="workflow-table"><caption class="visually-hidden">Steps in execution order</caption><thead><tr><th>Step</th><th>Input → Output</th><th>Inside / Checks</th><th>Order</th></tr></thead><tbody>${visibleSteps.map(step=>{const i=skill.steps.indexOf(step);return `<tr class="${step.id===state.selected?'selected':''}"><td><button type="button" data-step="${wfEsc(step.id)}" aria-pressed="${step.id===state.selected}"><span class="node-number">${String(i+1).padStart(2,'0')}</span><strong>${wfEsc(step.title||'Name this step')}</strong></button></td><td><span class="small">${wfEsc(inputFor(skill,i)||'Input not defined yet')}</span><span aria-hidden="true">↓</span><strong>${wfEsc(step.output||'Define this output')}</strong></td><td><span class="small">${wfEsc(wfInsideSummary(step))}</span><div class="step-statuses">${workflowStepStatus(skill,step,state.checks)}</div></td><td>${wfMoveControls(step,i,skill.steps.length)}</td></tr>`;}).join('')}</tbody></table>${!visibleSteps.length?'<div class="empty"><h3>Nothing needs attention</h3><p>Every step is defined and confirmed.</p></div>':''}</div>`;
  }else{
    body=`<nav class="step-rail" aria-label="Skill steps"><button type="button" class="rail-brief" data-action="project"><span class="eyebrow">STARTS WITH</span><strong>${wfEsc(skill.input||'Define the overall input')}</strong></button>${skill.steps.map((step,i)=>`<button type="button" class="rail-step ${step.id===state.selected?'selected':''}" data-step="${wfEsc(step.id)}" aria-pressed="${step.id===state.selected}"><span class="node-number">${String(i+1).padStart(2,'0')}</span><span><strong>${wfEsc(step.title||'Name this step')}</strong><span class="step-statuses">${workflowStepStatus(skill,step,state.checks)}</span></span></button>`).join('')}<button type="button" class="rail-brief rail-finish" data-action="project"><span class="eyebrow">FINISHES WITH</span><strong>${wfEsc(skill.outcome||'Define the final result')}</strong></button>${wfButton('＋ Add step','add-step','','quiet')}</nav>`;
  }
  if(!skill.steps.length)body+=`<div class="empty"><h3>Add the first meaningful step</h3><p class="small">Define what comes in, what should happen, and what comes out.</p>${wfButton('Add your first step','add-step','','primary')}</div>`;
  return `<div class="canvas-bar"><span>${skill.steps.length} ordered ${skill.steps.length===1?'step':'steps'}${state.view==='guided'&&index>=0?` · ${index+1} selected`:''}</span><div class="flex">${skill.steps.some(step=>!step.reviewed)?wfButton('Review unconfirmed steps','review-steps'):''}${wfButton('＋ Add step','add-step')}</div></div>${body}<div class="resources-bar"><span>Reference documents</span>${skill.references.map(reference=>`<button class="ref-chip" data-reference="${wfEsc(reference.id)}">${wfEsc(reference.path.split('/').at(-1))}</button>`).join('')}${wfButton(`${skill.resources.length} supporting files`,'resources')}${wfButton('Shared values','definitions')}</div>`;
}

function wfContract(skill,step,index){
  return `<div class="contract-box"><span class="eyebrow">NEEDS · FROM ${index?'THE PREVIOUS STEP':'THE BRIEF'}</span><strong>${wfEsc(inputFor(skill,index)||'Input not defined yet')}</strong>${index?`<button class="inline-link" type="button" data-step="${wfEsc(skill.steps[index-1].id)}">Step ${index} · ${wfEsc(skill.steps[index-1].title)}</button>`:wfButton('Define overall input','project')}</div>${wfField('Does — what should happen in this step?','job',step.job,{multiline:true,rows:6,help:'Plain instructions, including how to tell the step worked.'})}${wfField('Produces','output',step.output,{help:index<skill.steps.length-1?`This becomes the input of step ${index+2}.`:'This is the workflow’s final produced result.'})}${wfField('Kind of step','kind',step.kind,{options:wfKinds.includes(step.kind)?wfKinds:[...wfKinds,step.kind]})}${step.kind==='Decision'?'<p class="small">This step still runs in sequence. Keep conditional choices inside its instructions or a Decision item inside this step.</p>':''}`;
}

function wfFacet(skill,facet,index,count,state){

// The browser keeps the working copy; the local server owns durable storage.
function createWorkspacePersistence({request=globalThis.fetch?.bind(globalThis),preview=false,onStatus=()=>{},delay=200}={}){
  let revision=0,lastSaved='',pending='',inFlight=null,timer=null,blocked=false,loaded=false,status=preview?'preview':'loading';
  const report=(state,message='')=>{status=state;onStatus({state,message});};
  const hasChanges=()=>Boolean(pending||inFlight);
  async function load(){
    if(preview){loaded=true;report('preview');return null;}
    report('loading');
    try{
      const response=await request('/api/workspace',{cache:'no-store'}),result=await response.json();
      if(!response.ok)throw new Error(result.error||'The local database could not be opened.');
      if(!Number.isSafeInteger(result.revision)||!result.workspace)throw new Error('Invalid database response.');
      revision=result.revision;lastSaved=JSON.stringify(result.workspace);pending='';blocked=false;loaded=true;report('saved');return result.workspace;
    }catch(error){loaded=false;blocked=true;report('unavailable',error.message);throw error;}
  }
  function schedule(workspace){
    if(preview){report('preview');return;}
    if(!loaded)return;
    // Keep the live working copy until the debounce expires. Large retained
    // sources are serialized once per save, rather than once per keystroke.
    pending=workspace;
    if(blocked)return;
    report('saving');clearTimeout(timer);timer=setTimeout(()=>{flush().catch(()=>{});},delay);
  }
  async function flush(){
    clearTimeout(timer);
    if(preview||!loaded||blocked)return false;
    if(inFlight){await inFlight;return pending&&!blocked?flush():!blocked;}
    if(!pending){report('saved');return true;}
    const payload=typeof pending==='string'?pending:JSON.stringify(pending);pending='';
    if(payload===lastSaved){report('saved');return true;}
    report('saving');
    inFlight=(async()=>{
      try{
        const response=await request('/api/workspace',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision,workspace:JSON.parse(payload)})}),result=await response.json();
        if(!response.ok){const error=new Error(result.error||'The database save failed.');error.conflict=response.status===409;throw error;}
        if(!Number.isSafeInteger(result.revision))throw new Error('Invalid save acknowledgment.');
        revision=result.revision;lastSaved=payload;if(pending===lastSaved)pending='';
        if(!pending)report('saved');return true;
      }catch(error){if(!pending)pending=payload;blocked=true;clearTimeout(timer);report(error.conflict?'conflict':'error',error.message);return false;}
    })();
    const result=await inFlight;inFlight=null;
    if(pending&&!blocked){clearTimeout(timer);timer=setTimeout(()=>{flush().catch(()=>{});},delay);}return result;
  }
  async function retry(){if(status==='conflict')return false;blocked=false;return loaded?flush():load();}
  async function reload(){if(inFlight)await inFlight;return load();}
  return {load,schedule,flush,retry,reload,hasChanges,get status(){return status;},get revision(){return revision;}};
}

}

async function prepareImport(files,destination=importDestination){const request=++importRequestToken;try{if(!workspaceProject(workspace,destination))throw new Error('Choose a project before importing a skill.');const incoming=importMarkdownFiles(files);if(incoming.resources.some(r=>r.untranslated.includes('Source analysis required'))){notify('Analyzing source behavior and asset structure locally…');await analyzeProjectSources(incoming);}if(request!==importRequestToken)return;if(!workspaceProject(workspace,destination))throw new Error('The destination project is no longer available.');pendingImport=incoming;pendingImportProjectId=destination;openDialog('import-review');}catch(error){if(request===importRequestToken)dialogError(error.message);}}

 if(action==='approve'){const s=step();if(!s.job.trim()||!s.output.trim()||!project.input.trim()){tab='definition';render();notify('Define the overall input and this step’s instructions and output before confirming the proposal.',true);return;}mutate(()=>s.reviewed=true,project.generation||project.optimization?'Proposed step confirmed.':'Imported step confirmed.');return;}
 if(action==='clear-override'){mutate(()=>step().facets.find(f=>f.id===b.dataset.id).override='','This item now uses the shared value.');return;}
 if(action==='remove-facet'){mutate(()=>{step().facets=step().facets.filter(f=>f.id!==b.dataset.id);tab='facets';},'Inside item removed. Undo brings it back.');closeDialog();return;}
 if(action==='remove-reference'){mutate(()=>{project.references=project.references.filter(r=>r.id!==b.dataset.id);referenceId=project.references[0]?.id||'';},'Reference removed. Missing dependencies appear in review.');return;}
 if(action==='remove-definition'){mutate(()=>project.definitions=project.definitions.filter(d=>d.id!==b.dataset.id),'Shared value removed. Linked items need review.');return;}
 if(action==='remove-field'){mutate(()=>project.screens.input=project.screens.input.filter(f=>f.id!==b.dataset.id),'Input field removed.');closeDialog();return;}
 if(action==='move-field'){mutate(()=>{const i=project.screens.input.findIndex(f=>f.id===b.dataset.id);if(i>0){const [f]=project.screens.input.splice(i,1);project.screens.input.splice(i-1,0,f);}},'Input field order updated.');closeDialog();return;}
 if(action==='remove-row'){mutate(()=>project.screens.sampleRows.splice(Number(b.dataset.index),1),'Example row removed.');closeDialog();return;}
 if(action==='remove-scenario'){mutate(()=>project.scenarios=project.scenarios.filter(s=>s.id!==b.dataset.id),'Scenario removed.');closeDialog();return;}
 if(action==='preview-output'){capturePreview();const missing=project.screens.input.filter(f=>f.required&&!String(previewValues[f.id]??screenInputDefault(project,f)).trim());if(missing.length){dialogError('Complete the required inputs: '+missing.map(f=>f.label).join(', '));return;}previewTab='output';openDialog('preview');return;}
 if(action==='review-issue'){const issue=validate(project).errors[Number(b.dataset.index)];if(!issue)return;if(issue.stepId){selected=issue.stepId;page='workflow';tab=['facets','resources','references'].includes(issue.field)?'facets':'definition';render();$('.inspector')?.scrollIntoView({block:'start',behavior:'smooth'});}else if(issue.field==='optimization')openDialog('optimization-setup');else if(issue.field==='generation')openDialog('generation-review');else if(issue.field==='project'){page='brief';render();}else if(issue.field==='import')openDialog('import-notes');else if(issue.field==='adversarial'){page='package';render();}else{if(issue.field==='resources'){page='references';referenceTab='resources';const resource=project.resources.find(r=>issue.message.includes(r.sourcePath));if(resource){resourceId=resource.id;resourceFilter=resource.policy;}render();return;}page=issue.field==='screens'?'screens':issue.field==='definitions'||issue.field==='references'?'references':'workflow';if(issue.field==='definitions')referenceTab='definitions';render();}return;}
 if(action==='export'){try{await verifyOptimizationEvidence(project);const files=compile(project),folder=project.slug+'/';download(writeZip(Object.fromEntries(Object.entries(files).map(([path,text])=>[folder+path,text]))),project.slug+'.zip');notify('Skill ZIP prepared with English specifications and retained assets.');}catch(error){notify(error.message,true);}return;}
 openDialog(action,{id:b.dataset.id||'',index:Number(b.dataset.index??-1)});
});

document.addEventListener('change',event=>{if(!event.target.matches('[data-step-jump]'))return;selected=event.target.value;mobileWorkflowPane='overview';render();diagramController?.focusSelected();});
document.addEventListener('toggle',event=>{const facet=event.target;if(!facet.matches?.('[data-facet-container]'))return;if(facet.open)openFacets.add(facet.dataset.facetContainer);else openFacets.delete(facet.dataset.facetContainer);},true);
document.addEventListener('focusout',event=>{if(event.target.matches?.('[data-edit]'))inlineHistoryKey='';});
document.addEventListener('input',event=>{
 const control=event.target,current=step();
 if(page==='brief'&&control.dataset.edit==='brief'){
  const key=control.dataset.key;if(!['title','slug','description','purpose','input','outcome','instructions','extraFrontmatter'].includes(key))return;
  mutate(()=>project[key]=control.value,'',{renderPage:false,coalesceKey:project.id+':brief:'+key});$('#project-title').textContent=project.title;$('#project-description').textContent=project.purpose||'Build a process one meaningful transformation at a time.';refreshChapterRail();return;
 }
 if(page!=='workflow'||!current||!control.matches?.('[data-edit]'))return;
 const key=control.dataset.key,scope=control.dataset.edit,facet=scope==='facet'?current.facets.find(f=>f.id===control.dataset.id):null;
 if(scope==='facet'&&!facet)return;
 const allowed=scope==='step'?['title','kind','job','output','exampleInput','exampleOutput']:scope==='facet'?['title','type','instructions','definitionId','override','connection','operation']:['references','resourceIds'];
 if(!allowed.includes(key))return;
 const value=control.value;
 mutate(()=>{if(scope==='binding'){const values=new Set(current[key]);if(control.checked)values.add(value);else values.delete(value);current[key]=[...values];}else (facet||current)[key]=value;},'',{renderPage:false,coalesceKey:project.id+':'+current.id+':'+scope+':'+(facet?.id||'')+':'+key});
 if(scope==='facet'){
   const container=control.closest('[data-facet-container]'),summary=container.querySelector('summary');
   summary.querySelector('span').textContent=facet.title||'New inside item';summary.querySelector('.tag').textContent=facet.type;const definition=project.definitions.find(d=>d.id===facet.definitionId);summary.querySelector('.facet-conflict').hidden=!(definition&&facet.override&&facet.override!==definition.value);const actions=container.querySelector('.override-actions');if(actions)actions.hidden=!facet.override;
   if(key==='type'||key==='definitionId'){const position=control.selectionStart;$('.inspector').innerHTML=workflowInspectorMarkup(project,workflowState());const replacement=[...$('.inspector').querySelectorAll('[data-edit="facet"]')].find(field=>field.dataset.id===facet.id&&field.dataset.key===key);replacement?.focus();if(typeof position==='number'&&replacement?.setSelectionRange)replacement.setSelectionRange(position,position);}
 }
});
$('#chapter-select').addEventListener('change',event=>{if(!project||!SKILL_CHAPTERS.some(chapter=>chapter.page===event.target.value))return;page=event.target.value;render();$('#project-title').setAttribute('tabindex','-1');$('#project-title').focus({preventScroll:true});});
document.addEventListener('keydown',event=>{const active=event.target.closest?.('[role="tab"][data-tab]');if(!active||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const tabs=[...active.parentElement.querySelectorAll('[role="tab"]')],index=tabs.indexOf(active),next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length,key=tabs[next].dataset.tab;tabs[next].click();document.querySelector('[role="tab"][data-tab="'+key+'"]')?.focus({preventScroll:true});});
document.addEventListener('keydown',event=>{const card=event.target.closest?.('[data-step]');if(card&&event.altKey&&!event.ctrlKey&&!event.metaKey&&['ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();const id=card.dataset.step;moveWorkflowStep(id,event.key==='ArrowUp'?-1:1);requestAnimationFrame(()=>[...$('.stage').querySelectorAll('[data-step]')].find(item=>item.dataset.step===id)?.focus());}});
document.addEventListener('input',event=>{if(dialogState?.mode==='new'&&event.target.name==='title'){const slug=$('#dialog-form [name="slug"]');if(slug&&!slug.dataset.manual)slug.value=slugify(event.target.value);}if(event.target.name==='slug')event.target.dataset.manual='true';});
$('#dialog').addEventListener('close',()=>{reviewController?.abort();reviewController=null;reviewToken++;draftController?.abort();draftController=null;draftToken++;if(dialogState?.mode==='optimization-proposal'){pendingOptimization=null;pendingOptimizationProjectId='';}if(dialogState?.mode==='import'||dialogState?.mode==='import-review'){pendingImport=null;pendingImportProjectId='';importRequestToken++;}dialogState=null;});
$('#skill-file').addEventListener('change',async event=>{const file=event.target.files[0],destination=importDestination;if(!file)return;try{if(file.size>8*1024*1024)throw new Error('Import files up to 8 MB.');const files=file.name.toLowerCase().endsWith('.zip')?await readZip(await file.arrayBuffer()):{'SKILL.md':await file.text()};await prepareImport(files,destination);}catch(error){dialogError(error.message);}});
$('#project-file').addEventListener('change',async event=>{const file=event.target.files[0],request={...restoreRequest};if(!file)return;try{
 if(file.size>128*1024*1024)throw new Error('Backup files must be under 128 MB.');
 const text=await file.text();
 if(request.mode==='skill'){const skill=readProject(text);await verifyOptimizationEvidence(skill);const container=workspaceProject(workspace,request.projectId);if(!container)throw new Error('The destination project is no longer available.');if(container.skills.some(item=>item.id===skill.id))skill.id=uid();replaceProject(skill,'Skill backup restored into the project.',request.projectId);}
 else {const value=JSON.parse(text);save();if(value?.type==='skill-blueprint-workspace'){const incoming=readWorkspace(text);await verifyWorkspaceOptimizationEvidence(incoming);if(workspace.projects.length+incoming.projects.length>200)throw new Error('Restore would exceed the 200-project limit.');for(const container of incoming.projects)restoreWorkspaceProject(workspace,container);save();showProjects();notify(incoming.projects.length+' projects restored. Existing projects were preserved.');}else{const incoming=readWorkspaceProjectBackup(text);await verifyWorkspaceOptimizationEvidence({projects:[incoming]});const restored=restoreWorkspaceProject(workspace,incoming);save();openWorkspaceProject(restored.id);notify('Project restored with all its skills.');}}
 }catch(error){notify(error.message,true);}event.target.value='';});
$('#reference-file').addEventListener('change',async event=>{const skillId=project?.id,destination=activeProjectId;try{const files=[...event.target.files];if(files.some(f=>!f.name.endsWith('.md')||f.size>2*1024*1024))throw new Error('Choose Markdown files up to 2 MB each.');const refs=await Promise.all(files.map(async f=>({id:uid(),path:'references/'+f.name,content:await f.text()})));if(project?.id!==skillId||activeProjectId!==destination)throw new Error('The selected skill changed while the file was loading. Open the intended skill and try again.');if(refs.some(r=>project.references.some(x=>x.path===r.path))||new Set(refs.map(r=>r.path)).size!==refs.length)throw new Error('A reference with that name already exists. Edit it or rename the incoming file.');mutate(()=>{project.references.push(...refs);referenceId=refs[0]?.id||referenceId;page='references';referenceTab='files';},'Markdown references imported.');}catch(error){notify(error.message,true);}});
$('#resource-file').addEventListener('change',async event=>{const skillId=project?.id,destination=activeProjectId;try{const files=[...event.target.files];if(files.some(f=>f.size>8*1024*1024))throw new Error('Choose source files up to 8 MB each.');const sources=await Promise.all(files.map(async file=>preserveSource((/\.py$/i.test(file.name)?'scripts/':/\.html?$/i.test(file.name)?'templates/':/^license/i.test(file.name)?'':'assets/')+file.name,new Uint8Array(await file.arrayBuffer()))));if(project?.id!==skillId||activeProjectId!==destination)throw new Error('The selected skill changed while the file was loading. Open the intended skill and try again.');if(sources.some(o=>project.originals.some(x=>x.path===o.path))||new Set(sources.map(o=>o.path)).size!==sources.length)throw new Error('A source with that name is already preserved. Use a different filename.');mutate(()=>{project.originals.push(...sources);project.resources.push(...sources.map(draftResource));page='references';referenceTab='resources';resourceId=project.resources.at(-1)?.id||'';resourceFilter=project.resources.at(-1)?.policy||'generate';},'Complete source files attached.');await analyzePendingResources();}catch(error){notify(error.message,true);}});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();document.querySelector('[data-action="save-project"]').click();}});
const reviewReportInput=document.createElement('input');reviewReportInput.id='review-report-file';reviewReportInput.type='file';reviewReportInput.accept='.json';reviewReportInput.hidden=true;document.body.append(reviewReportInput);reviewReportInput.addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw new Error('Review reports must be at most 2 MB.');await acceptReviewReport(parseReviewerReport(await file.text()));}catch(error){notify(error.message,true);}});
async function acceptReviewReport(report){const base=project,snapshot=reviewSnapshot(project),target=copy(project);await recordIndependentReview(target,report);if(base!==project||snapshot!==reviewSnapshot(project))throw new Error('The skill changed while checking the report. Try again.');mutate(()=>{project.independentReview=target.independentReview;page='package';},'Independent review recorded. Read the findings before downloading.',{definitionChange:false});}
async function checkReviewEngine(){const current=dialogState,submit=$('#dialog-form button[type="submit"]');submit.disabled=true;try{const response=await fetch('/api/skill-draft',{cache:'no-store'}),status=await response.json();if(dialogState!==current)return;$('#review-engine-status').textContent=status.ready?'Claude Code is ready · '+status.model:status.message||'Claude Code is unavailable. Use another reviewer from the review panel.';submit.disabled=!status.ready;}catch{if(dialogState===current)$('#review-engine-status').textContent='Start the updated local server to use Claude Code. The external reviewer option remains available.';}}
async function runIndependentReview(){const current=dialogState,request=++reviewToken,controller=new AbortController();reviewController=controller;const submit=$('#dialog-form button[type="submit"]');submit.disabled=true;$('#review-engine-status').textContent='Reviewing in a fresh session… Cancel stops this request.';try{save();if(!await persistence.flush()||persistence.hasChanges())throw new Error('Resolve the database save conflict before review.');const base=project,snapshot=reviewSnapshot(project),sourceDigest=await reviewDigest(snapshot),sourceRevision=project.revision;const response=await fetch('/api/skill-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId:activeProjectId,skillId:project.id,sourceDigest,sourceRevision}),signal:controller.signal}),result=await response.json();if(request!==reviewToken||dialogState!==current)return;if(!response.ok)throw new Error(result.error||'Independent review failed.');if(base!==project||snapshot!==reviewSnapshot(project)||result.sourceDigest!==sourceDigest||result.sourceRevision!==sourceRevision)throw new Error('The skill changed. Start a fresh review.');await recordIndependentReview(copy(project),result.report);pendingReview={report:result.report,snapshot};reviewController=null;openDialog('review-result');}catch(error){if(request===reviewToken&&dialogState===current){dialogError(error.name==='AbortError'?'Review cancelled. No report was recorded.':error.message);submit.disabled=false;}}finally{if(reviewController===controller)reviewController=null;}}
function createReviewSnapshotData(p){const value=copy(p);delete value.independentReview;return value;}
await initializeStorage();
window.addEventListener('beforeunload',event=>{if(persistence.hasChanges()){event.preventDefault();event.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)persistence.flush();});
document.querySelector('.brand').addEventListener('click',event=>{event.preventDefault();showProjects();});
</script>
