name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      STUDIO_PYTHON: python
      STUDIO_CLAUDE_PATH: missing-ci-cli
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run test:analyzer
      - name: Verify reproducible build and empty database template
        run: git diff --exit-code -- studio/dist/skill-blueprint-studio.html studio/seed/workspace.sqlite

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STUDIO_PYTHON: python
      STUDIO_CLAUDE_PATH: missing-ci-cli
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-failure-screenshots
          path: test-results/browser/
          retention-days: 7
          if-no-files-found: ignore
